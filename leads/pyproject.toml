[project]
name = "hav-bot"
version = "0.1.0"
description = "Telegram-бот заявок HAV"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "aiohttp>=3.11,<4",
]

[project.scripts]
hav-bot = "hav_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
