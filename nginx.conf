server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # GZIP — стискаємо текст для швидкості
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # CACHE — картинки довго, css/js коротко (імена файлів без хеша)
    # ==========================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /content.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Заявки йдуть у сервіс leads. Токен бота тут не з'являється.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $leads_upstream leads:8080;
        proxy_pass http://$leads_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # ==========================================
    # HTML — без кешу (щоб оновлення одразу бачили)
    # ==========================================
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ==========================================
    # SPA fallback (якщо згодом додасте роутинг)
    # ==========================================
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ==========================================
    # Блокуємо доступ до прихованих файлів
    # ==========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================
    # Favicon — щоб не спамило 404 у логах
    # ==========================================
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # ==========================================
    # Кастомні сторінки помилок (опційно)
    # ==========================================
    # error_page 404 /index.html;
}
